<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D AR 線上體驗 (優化視角與燈光)</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    
    <style>
        /* 讓網頁全螢幕滿版，適合手機瀏覽 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f7f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 滿版 3D 檢視器設定 */
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        /* 自訂 AR 按鈕樣式：置中靠底部 */
        .ar-button {
            background-color: #007aff;
            color: white;
            border-radius: 100px;
            border: none;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s, transform 0.2s;
            z-index: 999;
        }

        .ar-button:active {
            background-color: #0056b3;
            transform: translateX(-50%) scale(0.95);
        }

        /* 當手機不支援 AR 功能時，自動隱藏按鈕 */
        model-viewer:not([ar-status="activate"]) .ar-button {
            display: none;
        }

        /* 載入中的進度條樣式 */
        .progress-bar {
            display: block;
            width: 33%;
            height: 4px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
        }
        .update-bar {
            background: #007aff;
            width: 0%;
            height: 100%;
            transition: width 0.3s;
        }
        model-viewer[ar-status="not-presenting"] .progress-bar {
            display: none;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="https://pub-1820b16420764d2d8077cc45bbb631e6.r2.dev/test005.glb" 
        ios-src="https://pub-1820b16420764d2d8077cc45bbb631e6.r2.dev/test005.usdz"
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        touch-action="pan-y"
        shadow-intensity="1"
        exposure="2" 
        tone-mapping="aces"
        camera-orbit="30deg 60deg 80%" 
        auto-rotate>
        
        <div class="progress-bar" slot="progress-bar">
            <div class="update-bar"></div>
        </div>

        <button slot="ar-button" class="ar-button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            進入 AR 空間體驗
        </button>

    </model-viewer>

    <script>
        // 監聽載入進度條動畫
        const onProgress = (event) => {
            const progressBar = event.target.querySelector('.update-bar');
            if(progressBar) {
                progressBar.style.width = `${event.detail.totalProgress * 100}%`;
            }
        };
        document.querySelector('model-viewer').addEventListener('progress', onProgress);
    </script>
</body>
</html>
